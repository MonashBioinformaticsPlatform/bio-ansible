---
- name: Set ownership of all files and directories in {{ apps_dir }} to {{ main_guy }}:{{ main_guy }}
  tags: perms
  ansible.builtin.file:
    path: "{{ apps_dir }}"
    state: directory
    recurse: true
    follow: false
    owner: "{{ main_guy }}"
    group: "{{ main_guy }}"
  become: true

- name: Ensure 'other' has read permission if 'group' has read (directories)
  tags: ['perms', 'shpc']
  ansible.builtin.shell: "find {{ shpc_root_dir }} -type d -perm /g+r -exec chmod o+r {} +"
  become: true
  changed_when: false # Shell module always reports changed; find/chmod is idempotent here.

- name: Ensure 'other' has execute permission if 'group' has execute (directories)
  tags: ['perms', 'shpc']
  ansible.builtin.shell: "find {{ shpc_root_dir }} -type d -perm /g+x -exec chmod o+x {} +"
  become: true
  changed_when: false

- name: Ensure 'other' has read permission if 'group' has read (files)
  tags: ['perms', 'shpc']
  ansible.builtin.shell: "find {{ shpc_root_dir }} -type f -perm /g+r -exec chmod o+r {} +"
  become: true
  changed_when: false

- name: Ensure 'other' has execute permission if 'group' has execute (files)
  tags: ['perms', 'shpc']
  ansible.builtin.shell: "find {{ shpc_root_dir }} -type f -perm /g+x -exec chmod o+x {} +"
  become: true
  changed_when: false