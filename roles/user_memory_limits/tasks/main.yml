---
# Mitigations for host-wide OOM cascades on shared multi-user compute hosts
# (see bio2 incident, Nov 2026). Applies to any host where many users run
# memory-hungry jobs (R mclapply, Jupyter, VS Code Remote, tmux) outside a
# scheduler or RStudio Launcher.

- name: Create systemd drop-in directories
  tags: ['oom']
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  with_items:
    - /etc/systemd/system/user-.slice.d
    - /etc/systemd/user.conf.d

- name: Limit memory per user slice
  tags: ['oom']
  copy:
    dest: /etc/systemd/system/user-.slice.d/50-memory.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (role user_memory_limits)
      [Slice]
      MemoryMax={{ user_memory_max }}
  notify: Reload systemd

# DefaultOOMScoreAdjust= (and the +200 default it overrides) only exist in
# systemd >= 250, i.e. Ubuntu 22.10+. On Ubuntu 22.04 (systemd 249) user
# daemons already run at oom_score_adj=0 and the key would be unknown.
- name: Get systemd version
  tags: ['oom']
  command: systemctl --version
  register: user_memory_limits_systemd_version
  changed_when: false
  check_mode: no

- name: Set default OOM score adjustment for user service managers
  tags: ['oom']
  when: user_memory_limits_systemd_version.stdout_lines[0].split()[1] | int >= 250
  copy:
    dest: /etc/systemd/user.conf.d/50-oom-adjust.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (role user_memory_limits)
      [Manager]
      DefaultOOMScoreAdjust={{ user_default_oom_score_adjust }}
  notify: Reload systemd

# --- systemd-oomd -----------------------------------------------------------
# Needs PSI and cgroup v2 with the memory controller (present on bio1-4).
# Only slices with ManagedOOMMemoryPressure=kill are acted on; here that is
# every user slice. oomd kills the whole offending cgroup (e.g. an ssh
# session scope), not a single process.

- name: Install systemd-oomd
  tags: ['oom']
  apt:
    name: systemd-oomd
    state: present
    # No update_cache here: a failing third-party apt repo (seen on bio4: expired
    # or missing keys) makes the whole cache update fail, and the package is
    # already in the existing index.
  when: user_memory_limits_oomd | bool

- name: Create oomd config directory
  tags: ['oom']
  file:
    path: /etc/systemd/oomd.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: user_memory_limits_oomd | bool

- name: Set oomd memory pressure duration
  tags: ['oom']
  copy:
    dest: /etc/systemd/oomd.conf.d/50-oomd.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (role user_memory_limits)
      [OOM]
      DefaultMemoryPressureDurationSec={{ user_oomd_memory_pressure_duration }}
  when: user_memory_limits_oomd | bool
  notify: Restart systemd-oomd

- name: Enable oomd memory pressure kills on user slices
  tags: ['oom']
  copy:
    dest: /etc/systemd/system/user-.slice.d/60-oomd.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (role user_memory_limits)
      [Slice]
      ManagedOOMMemoryPressure=kill
      ManagedOOMMemoryPressureLimit={{ user_oomd_memory_pressure_limit }}
  when: user_memory_limits_oomd | bool
  notify:
    - Reload systemd
    - Restart systemd-oomd

- name: Enable and start systemd-oomd
  tags: ['oom']
  systemd:
    name: systemd-oomd
    enabled: yes
    state: started
  # In --check mode the package is not installed yet, so the unit can't be found.
  ignore_errors: "{{ ansible_check_mode }}"
  when: user_memory_limits_oomd | bool
