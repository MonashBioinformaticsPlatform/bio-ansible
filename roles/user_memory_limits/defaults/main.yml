---
# Maximum memory any single user (user-<uid>.slice) may use, as a percentage of
# total RAM. Systemd accepts a percentage directly. A runaway job is then
# OOM-killed inside its own user slice instead of triggering a host-wide OOM
# that takes out every user's session daemons.
user_memory_max: "90%"

# Default OOM score adjustment for services in each user's `systemd --user`
# manager. Upstream systemd defaults to +200 (manager's +100 plus 100), which on a
# large-RAM shared host outweighs the RSS of a real memory hog and makes the OOM
# killer pick other users' dbus-daemon/systemd/pipewire instead. 0 means victims
# are chosen by actual memory use.
user_default_oom_score_adjust: 0

# systemd-oomd: kills a user's runaway cgroup when its memory pressure (PSI)
# stays high, seconds into a stall instead of the minutes the kernel OOM
# killer can take on a no-swap host. Set false to skip it.
user_memory_limits_oomd: true
# Kill when a user's slice has memory pressure above this for the duration below.
user_oomd_memory_pressure_limit: "60%"
user_oomd_memory_pressure_duration: "20s"
