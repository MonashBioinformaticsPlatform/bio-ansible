---
# Reloading re-applies MemoryMax to already-active user-<uid>.slice units, so
# existing sessions are limited without anyone needing to log out.
- name: Reload systemd
  systemd:
    daemon_reload: yes

- name: Restart systemd-oomd
  systemd:
    name: systemd-oomd
    state: restarted
  when: not ansible_check_mode
