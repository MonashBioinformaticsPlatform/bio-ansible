---
- name: Set target lua version (Ubuntu 22.04 / 24.04, lua5.3)
  tags: ['lua', 'apt']
  set_fact: lua_version="5.3"
  when: ansible_distribution == 'Ubuntu' and ansible_lsb.major_release|int >= 22

- name: Set target lua version  (Ubuntu 20.04, lua5.3)
  tags: ['lua', 'apt']
  set_fact: lua_version="5.3"
  when: ansible_distribution == 'Ubuntu' and ansible_lsb.major_release|int == 20

- name: apt-get lua & LMOD dependencies (Ubuntu 20.04)
  tags: ['lua', 'apt']
  apt:
    name: "{{ item }}"
    state: present
    autoremove: yes
  with_items:
    - lua5.3
    - liblua5.3-dev
    - liblua5.3-0:amd64
    - liblua5.3-dev:amd64
    - luarocks
    - tcl-dev # Added for LMOD FAST_TCL_INTERP
    # We get these via luarocks, LMOD doesn't like the apt versions
    #  - lua-filesystem
    #  - lua-posix
    #  - lua-posix-dev
  when: ansible_distribution == 'Ubuntu' and ansible_lsb.major_release|int == 20

- name: apt-get lua & LMOD dependencies (Ubuntu 22.04 / 24.04)
  tags: ['lua', 'apt']
  apt:
    name: "{{ item }}"
    state: present
    autoremove: yes
  with_items:
    - lua5.3
    - liblua5.3-dev
    - liblua5.3-0:amd64
    - liblua5.3-dev:amd64
    - luarocks
    - tcl-dev # Added for LMOD FAST_TCL_INTERP
    # We get these via luarocks, LMOD doesn't like the apt versions
    #  - lua-filesystem
    #  - lua-posix
    #  - lua-posix-dev
  when: ansible_distribution == 'Ubuntu' and ansible_lsb.major_release|int >= 22

- name: set default lua (20.04)
  tags: ['lua']
  shell: |
    sudo update-alternatives --remove-all lua
    sudo update-alternatives --install /usr/bin/lua lua /usr/bin/lua{{ lua_version }} 90
  when: ansible_distribution == 'Ubuntu' and ansible_lsb.major_release|int == 20

- name: set default lua (22.04 / 24.04)
  tags: ['lua']
  shell: |
    sudo update-alternatives --remove-all lua
    sudo update-alternatives --install /usr/bin/lua lua /usr/bin/lua{{ lua_version }} 90
  when: ansible_distribution == 'Ubuntu' and ansible_lsb.major_release|int >= 22

- name: install luarocks packages
  tags: ['lua']
  shell: |
    luarocks --lua-version {{ lua_version }} install luaposix
    luarocks --lua-version {{ lua_version }} install luafilesystem
