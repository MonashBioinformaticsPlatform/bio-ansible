---

- name: download r {{ version }}
  tags: r_base
  get_url: 
    url: "{{ r_dl_url_base }}/R-{{ version.split('.')[0] }}/R-{{ version }}.tar.gz"
    dest: "{{ source_dir }}/R-{{ version }}.tar.gz"

- name: uncompress r {{ version }}
  tags: r_base
  unarchive:
      src: "{{ source_dir }}/R-{{ version }}.tar.gz"
      dest: "{{ source_dir }}"
      copy: no

- name: Check whether R {{ version }} libcurl 8 patch is already applied
  tags: r_base
  ansible.builtin.command:
    cmd: grep -q 'LIBCURL_VERSION_MAJOR == 8' {{ source_dir }}/R-{{ version }}/configure
  register: r_libcurl8_patch_applied
  failed_when: false
  changed_when: false
  when: version is version('4.3.0', '<')

- name: patch R {{ version }} for libcurl 8
  tags: r_base
  ansible.builtin.patch:
    src: libcurl-8.patch
    basedir: "{{ source_dir }}/R-{{ version }}"
    strip: 0
  when:
    - version is version('4.3.0', '<')
    - r_libcurl8_patch_applied.rc != 0

