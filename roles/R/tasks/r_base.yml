- name: build r {{ version }}
  tags: r_base
  shell: |
    set -euo pipefail

    {% if ansible_distribution == 'Ubuntu' and ansible_lsb.major_release | int >= 24 %}
    export FC="$(command -v gfortran)"
    {% elif ansible_distribution == 'Ubuntu' and ansible_lsb.major_release | int >= 20 %}
    export FC="$(command -v gfortran-10 || command -v gfortran)"
    {% else %}
    export FC="$(command -v gfortran)"
    {% endif %}

    {% if ansible_distribution == 'Ubuntu' and ansible_lsb.major_release | int >= 22 %}
    export CPPFLAGS="${CPPFLAGS:-} -I/usr/include/tirpc"
    export LIBS="${LIBS:-} -ltirpc"
    {% endif %}

    cd {{ source_dir }}/R-{{ version }}
    make clean
    ./configure --prefix={{ apps_dir }}/R/{{ version }} --enable-R-shlib --enable-memory-profiling
    make -j {{ threads }}
    make install
  args:
    executable: /bin/bash
    creates: "{{ apps_dir }}/R/{{ version }}/bin/Rscript"
  when: not static_build|bool

# Experimental: Can we create static builds that better survive major Ubuntu upgrades ?
- name: "build r {{ version }} (static)"
  tags: r_base
  shell: |
    set -euo pipefail

    {% if ansible_distribution == 'Ubuntu' and ansible_lsb.major_release | int >= 22 %}
    export CPPFLAGS="${CPPFLAGS:-} -I/usr/include/tirpc"
    export LIBS="${LIBS:-} -ltirpc"
    {% endif %}

    cd {{ source_dir }}/R-{{ version }}

    # Attempt a static build. This requires static versions of all dependency libraries (zlib, pcre, curl, etc)
    # to be installed on the build machine.
    export LDFLAGS="-static"

    make clean
    ./configure --prefix={{ apps_dir }}/R/{{ version }} --disable-R-shlib --enable-memory-profiling
    make -j {{ threads }}
    make install
  args:
    executable: /bin/bash
    creates: "{{ apps_dir }}/R/{{ version }}/bin/Rscript"
  when: static_build|bool

- name: Verify R {{ version }} installation
  tags: r_base
  command: "{{ apps_dir }}/R/{{ version }}/bin/R --version"
  register: r_version_check
  changed_when: false
  failed_when: r_version_check.rc != 0

- name: Ensure "{{ modules_core }}/R" exists
  tags: r_base
  file:
    dest: "{{ modules_core }}/R"
    state: directory
    mode: 0755

- name: r {{ version }} module definition
  tags: r_base
  template:
    src: sw-module.lua.j2
    dest: "{{ modules_core }}/R/{{ version }}.lua"
    owner: "{{ main_guy }}"
    mode: 0644
  with_items:
    - dir: "R/{{ version }}"
      help_text: 'R language base'
#      env:
#        - name: R_HOME
#          value: "{{ apps_dir }}/R/{{ version }}/bin/R"

- name: setting register for r {{ version }}
  tags: r_base
  stat:
    path: "{{ apps_dir }}/R-{{ version }}/bin/Rscript"
  register: r

- name: removing r {{ version }} source file
  tags: r_base
  file:
    dest: "{{ source_dir }}/R-{{ version }}.tar.gz"
    state: absent
  when: "del_src and r.stat.exists"
